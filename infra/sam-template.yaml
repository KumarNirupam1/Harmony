AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Harmony — Ship It stack. Serverless ocean-cleanup mission planner.
  API (Lambda container + API Gateway HTTP API), DynamoDB mission store, and an
  S3 bucket for ocean field datasets & exported mission data.

Globals:
  Function:
    Timeout: 600
    MemorySize: 1536
    Architectures: [x86_64]
    Environment:
      Variables:
        HARMONY_BUCKET: !Ref DataBucket
        HARMONY_TABLE: !Ref MissionsTable
        HARMONY_DATA: /var/task/data/gulf_stream.npz

Parameters:
  ImageUri:
    Type: String
    Description: ECR container image URI for the Harmony simulation function.
    Default: ""

Resources:
  # ---- Simulation API (FastAPI via Lambda Web Adapter) ----
  MissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !If [UseImageUri, !Ref ImageUri, !Ref AWS::NoValue]
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      Policies:
        # NOTE: use plain managed ARNs here — SAM's shorthand policies
        # (e.g. DynamoDBCrudPolicy) are silently NOT attached for PackageType=Image.
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
    Metadata:
      DockerContext: ../
      Dockerfile: api/Dockerfile

  # Direct Lambda URL — API Gateway HTTP API caps integrations at 30s, but real
  # solves take ~60s. The web app uses this URL as its API base.
  MissionFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt MissionFunction.Arn
      Cors:
        AllowCredentials: false
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        AllowHeaders: ["*"]
        ExposeHeaders: ["*"]

  # ---- Mission history store ----
  MissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: missionId
          AttributeType: S
      KeySchema:
        - AttributeName: missionId
          KeyType: HASH

  # ---- Ocean field datasets & exports ----
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

Conditions:
  UseImageUri: !Not [!Equals [!Ref ImageUri, ""]]

Outputs:
  ApiUrl:
    Description: Base URL of the Harmony mission API (test with /health).
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionUrl:
    Description: Direct Lambda URL — no 30s API Gateway timeout; use this for long mission solves.
    Value: !GetAtt MissionFunctionUrl.FunctionUrl
  MissionsTableName:
    Description: DynamoDB table storing past missions.
    Value: !Ref MissionsTable
  DataBucketName:
    Description: S3 bucket for ocean field data.
    Value: !Ref DataBucket